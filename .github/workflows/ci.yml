name: RAG CI Pipeline

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build CI services
      - name: Build services
        run: docker compose -f docker-compose.ci.yml build

      # Start services
      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d

      # ---------------------------
      # Wait for Ollama
      # ---------------------------
      - name: Wait for Ollama
        run: |
          echo "Waiting for Ollama..."
          for i in {1..60}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is up"
              exit 0
            fi
            sleep 5
          done
          echo "Ollama failed to start"
          docker compose -f docker-compose.ci.yml logs ollama
          exit 1

      # ---------------------------
      # Wait for FastAPI
      # ---------------------------
      - name: Wait for FastAPI
        run: |
          echo "Waiting for FastAPI..."
          for i in {1..40}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "FastAPI is up"
              exit 0
            fi
            sleep 3
          done
          echo "FastAPI failed to start"
          docker compose -f docker-compose.ci.yml logs fastapi
          exit 1

      # ---------------------------
      # Health check
      # ---------------------------
      - name: Health check
        run: curl -f http://localhost:8000/health

      # ---------------------------
      # RAG test
      # ---------------------------
      - name: RAG test query
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/query \
            -H "Content-Type: application/json" \
            -d '{"question":"What is machine learning?"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"answer"'