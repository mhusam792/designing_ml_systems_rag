name: RAG CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # (OPTIONAL) only if you really need it
      - name: Build base image
        run: docker build -t rag-base -f docker/base/Dockerfile .

      - name: Build services (CI compose)
        run: docker compose -f docker-compose.ci.yml build

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d

      # 🔥 WAIT FOR OLLAMA (IMPORTANT)
      - name: Wait for Ollama
        run: |
          for i in {1..40}; do
            curl -s http://localhost:11434/api/tags && break
            echo "waiting ollama..."
            sleep 5
          done

      # 🔥 WAIT FOR FASTAPI
      - name: Wait for FastAPI
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8000/health && break
            echo "waiting fastapi..."
            sleep 3
          done

      - name: Health check
        run: curl -f http://localhost:8000/health

      - name: RAG test query
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/query \
          -H "Content-Type: application/json" \
          -d '{"question":"What is machine learning?"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"answer"'