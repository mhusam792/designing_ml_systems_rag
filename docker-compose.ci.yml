services:

  ollama:
    image: ollama/ollama
    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10

    # مهم جدًا: preload models
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.2:3b &&
      ollama pull nomic-embed-text &&
      wait
      "

  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - ./data/processed/chroma_db:/app/data/processed/chroma_db

  gradio:
    build:
      context: .
      dockerfile: docker/gradio/Dockerfile

    ports:
      - "7860:7860"

    depends_on:
      - fastapi

    environment:
      - GRADIO_API_URL=http://fastapi:8000/query

volumes:
  ollama_data: