name: RAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for FastAPI
        run: sleep 30

      - name: Health check
        run: curl -f http://localhost:8000/health

      - name: RAG test query
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/query \
          -H "Content-Type: application/json" \
          -d '{"question":"What is machine learning?"}')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q "answer"